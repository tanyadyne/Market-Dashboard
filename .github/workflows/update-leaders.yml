name: Update Liquid Leaders

on:
  # Triggered exclusively via API calls from cron-job.org (workflow_dispatch event).
  # No GitHub-native crons — those were unreliable and have been replaced by cron-job.org
  # which fires on time and respects timezones cleanly.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside regular market hours"
        required: false
        type: boolean
        default: false
      repair_history:
        description: "Repair a misdated RS-history snapshot only (no data fetch or rerank)"
        required: false
        type: boolean
        default: false
      restore_established_universe:
        description: "Restore approved established constituents after a market-cap metadata outage"
        required: false
        type: boolean
        default: false

# Don't let overlapping triggers stomp on each other. If one run is still in flight
# when the next fires, the second waits for the first to finish rather than being
# cancelled. This protects commits/pushes.
concurrency:
  group: update-leaders
  cancel-in-progress: false

jobs:
  update-leaders:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check if within market hours
        id: market_check
        run: |
          export TZ="America/New_York"
          # Use 10# prefix to force base-10 interpretation; bash treats numbers with
          # leading zeros (e.g. 08, 09) as octal which breaks for those values.
          HOUR=$((10#$(date +%H)))
          MIN=$((10#$(date +%M)))
          DOW=$(date +%u)  # 1=Mon ... 7=Sun
          TIME_MIN=$((HOUR * 60 + MIN))
          TODAY=$(date +%Y-%m-%d)
          # Hardcoded NYSE full-closure dates. Source: https://www.nyse.com/trade/hours-calendars
          # Last updated: 2026-04-29 (covers through 2028). Update yearly.
          # Note: blocks ALL trigger types including workflow_dispatch — manual triggers
          # on holidays would write incorrect data so are also blocked.
          HOLIDAYS="2026-01-01 2026-01-19 2026-02-16 2026-04-03 2026-05-25 2026-06-19 2026-07-03 2026-09-07 2026-11-26 2026-12-25 2027-01-01 2027-01-18 2027-02-15 2027-03-26 2027-05-31 2027-06-18 2027-07-05 2027-09-06 2027-11-25 2027-12-24 2028-01-17 2028-02-21 2028-04-14 2028-05-29 2028-06-19 2028-07-04 2028-09-04 2028-11-23 2028-12-25"
          # Holiday check first — applies to all trigger types
          if [ "${{ inputs.repair_history || false }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "History-only repair requested - running without market-data refresh"
          elif echo " $HOLIDAYS " | grep -q " $TODAY "; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "US market holiday ($TODAY) — skipping"
          elif [ "$DOW" -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Weekend ($(date '+%A %H:%M %Z')) — skipping"
          elif [ "${{ inputs.force || false }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Forced manual/API trigger on weekday (non-holiday) — running"
          elif [ $TIME_MIN -ge 570 ] && [ $TIME_MIN -le 961 ]; then
            # 570 = 9:30 AM ET (market open)
            # 961 = 4:01 PM ET (allow final close-adjacent cron dispatch)
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Within market hours window ($(date '+%H:%M %Z'))"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Outside market hours ($(date '+%H:%M %Z')) — skipping"
          fi

      - name: Checkout repo
        if: steps.market_check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.market_check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.market_check.outputs.skip != 'true'
        run: pip install --retries 5 --timeout 60 yfinance numpy requests curl_cffi

      - name: Test screener preset calculations
        if: steps.market_check.outputs.skip != 'true'
        run: |
          python -m unittest tests.test_preset_metrics tests.test_vcp_coils -v
          python -m unittest tests.test_repair_history tests.test_history_dates tests.test_universe_market_cap tests.test_restore_established_universe -v
          node tests/test_screener_presets.js

      - name: Fetch Liquid Leaders data
        if: steps.market_check.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.repair_history || false }}" = "true" ]; then
            python repair_history.py --repair-misdated-snapshot
          else
            if [ "${{ inputs.restore_established_universe || false }}" = "true" ]; then
              # Fetch the small recent history window containing the audited
              # seed, not the full repository history or market-data workflow.
              git fetch --no-tags --depth=100 origin main
              python restore_established_universe.py
            fi
            if [ "${{ inputs.force || false }}" = "true" ]; then
              export FORCE_INTRADAY=1
            fi
            if [ "${{ inputs.restore_established_universe || false }}" = "true" ] && ! ( [ -f leaders_intraday_baselines.json ] && python -c "import json; b=json.load(open('leaders_intraday_baselines.json')).get('d',{}); e=json.load(open('leaders.json')).get('e',[]); assert b and e and all('pf' in v and 'vcp_coil_1' in v and 'vcp_coil_2' in v for v in e)" ); then
              echo "ERROR: restoration requires existing intraday baselines; refusing to start a full rebuild"
              exit 2
            fi
          if [ -f leaders_intraday_baselines.json ] && python -c "import json; b=json.load(open('leaders_intraday_baselines.json')).get('d',{}); e=json.load(open('leaders.json')).get('e',[]); assert b and e and all('pf' in v and 'vcp_coil_1' in v and 'vcp_coil_2' in v for v in e)"; then
            python fetch_leaders_intraday.py
          else
            echo "Preset-ready intraday baselines missing — running one full rebuild"
            python fetch_leaders.py
          fi
          fi

      - name: Validate generated preset data
        if: steps.market_check.outputs.skip != 'true'
        run: node tests/validate_screener_preset_data.js

      - name: Commit and push
        if: steps.market_check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in leaders.json leaders_score_history.json leaders_mcap.json leaders_established_mcap.json leaders_index_universe.json leaders_intraday_baselines.json leaders_universe_grace.json leaders_missing_tickers.json screener_tickers.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Update leaders.json"
          git pull --rebase
          git push
